name: Pull request checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: PR checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test the service
        run: |
          mkdir -p test-reports
          docker build --pull --target test --tag boutique-pr:test .
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --mount "type=bind,source=$PWD/test-reports,target=/reports" boutique-pr:test
      - name: Build runtime image without publishing
        run: docker build --tag boutique-pr:runtime .
